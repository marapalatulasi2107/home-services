<!DOCTYPE html>
<html>
<head>
    <title>College Event Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f0f0;
            text-align: center;
        }

        h1 {
            background: navy;
            color: white;
            padding: 20px;
        }

        .event {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>College Event Management System</h1>

    <h2>Upcoming Events</h2>

    <div class="event">
        <h3>Technical Fest</h3>
        <p>Date: 10 November 2026</p>
        <button onclick="register('Technical Fest')">
            Register
        </button>
    </div>

    <div class="event">
        <h3>Cultural Fest</h3>
        <p>Date: 15 November 2026</p>
        <button onclick="register('Cultural Fest')">
            Register
        </button>
    </div>

    <div class="event">
        <h3>Sports Meet</h3>
        <p>Date: 20 November 2026</p>
        <button onclick="register('Sports Meet')">
            Register
        </button>
    </div>

    <script>
        function register(eventName) {
            alert("You registered for " + eventName);
        }
    </script>

</body>
</html>
